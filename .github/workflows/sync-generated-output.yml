name: Verify Generated Provider Output

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "cli/**"
      - "skill/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/sync-generated-output.yml"
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "cli/**"
      - "skill/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/sync-generated-output.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-output-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GENERATED_PATHS: >-
    .agents
    .claude
    .cursor
    .gemini
    .github/skills
    .kiro
    .opencode
    .pi
    .qoder
    .rovodev
    .trae
    .trae-cn
    plugin
    cli/engine/detect-antipatterns-browser.js
    extension/detector

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild generated output
        run: bun run build:release

      - name: Verify generated output is committed
        run: |
          git diff --check
          git diff --exit-code -- $GENERATED_PATHS
